<!-- ENCAIXE 1: o CSS crítico e o script abaixo vão embutidos no <head> do index.html, o mais cedo possível.
     O conteúdo entre os marcadores é cópia de src/abertura/abertura-critico.css e abertura-cabeca.js.
     Para refazer a cópia: node src/abertura/sincronizar.cjs -->
<!-- ab:critico:inicio -->
<style id="ab-critico">
/* RDX · abertura · CSS crítico: só o que garante o primeiro quadro. Vai embutido no <head>. */
#abertura { display: none; }
.ab-ligado #abertura {
  display: block;
  position: fixed;
  inset: 0;
  z-index: 100000;
  overflow: hidden;
  background: #c8f52a;
  color: #050706;
}
html.ab-travado { overflow: hidden; overscroll-behavior: none; }

/* a logo é montada e escrita pelo módulo: até ele chegar, o desenho fica vazio */
.ab-recorte { display: block; overflow: hidden; }
.ab-marca-caixa {
  position: absolute;
  left: 50%;
  top: 50%;
  width: clamp(240px, 22vw, 460px);
  margin: 0;
  padding: 0;
  transform: translate(-50%, -50%);
}
.ab-marca { display: block; width: 100%; height: auto; }
@media (max-width: 768px) {
  .ab-marca-caixa { width: 56vw; }
}

.ab-rodape { visibility: hidden; }

/* saída de socorro: o módulo não assumiu em 8 s */
.ab-socorro #abertura { opacity: 0; transition: opacity .4s ease; }
</style>
<!-- ab:critico:fim -->
<!-- ab:cabeca:inicio -->
<script>
/* RDX · abertura · liga a tela de carregamento antes do primeiro quadro. Vai embutido no <head>. */
(function (w, d) {
  var h = d.documentElement;
  var a = (w.__abertura = { estado: 'carregando', inicio: 0, socorro: 0 });
  var avisar = function (nome) {
    w.dispatchEvent(new CustomEvent(nome, { detail: { motivo: 'socorro' } }));
  };
  h.classList.add('ab-ligado', 'ab-travado');
  w.requestAnimationFrame(function () { a.inicio = w.performance.now(); });
  /* se o módulo da abertura não assumir em 8 s, ela sai sozinha */
  a.socorro = w.setTimeout(function () {
    a.estado = 'saindo';
    h.classList.add('ab-socorro');
    avisar('rdx:abertura-saindo');
    w.setTimeout(function () {
      h.classList.remove('ab-ligado', 'ab-travado', 'ab-socorro');
      a.estado = 'fim';
      avisar('rdx:abertura-fim');
    }, 450);
  }, 8000);
})(window, document);
</script>
<!-- ab:cabeca:fim -->
